name: AI News Agent

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Агент 1: Сбор новостей из RSS"
        run: python scripts/fetch_sources.py

      - name: "Агент 2: Анализ и скоринг"
        run: python scripts/analyze_news.py

      - name: "Картинки: подтягивание og:image"
        run: python scripts/fetch_og_images.py

      - name: "Агент 2.5: Генерация контента"
        run: python scripts/generate_content.py

      - name: "Агент 3: Генерация HTML-блога"
        run: python scripts/build_site.py

      - name: "Публикация отчётов"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Новых изменений нет."
          else
            git commit -m "Автоматический отчёт AI News Agent"
            git pull --rebase origin main
            git push
          fi
