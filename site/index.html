<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Office — Отчёты</title>
  <meta name="description" content="Отчёты AI Office: тренды, контент, публикации">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo">AI <span style="color: var(--teal);">OFFICE</span></h1>
      <p class="subtitle">Тренды · Контент · Публикации</p>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>📈 Все отчёты</h2>
      <p>Агенты собирают тренды из рус. RSS, создают посты и публикуют отчёты.</p>
    </section>
    <div class="reports-list" id="reports">
      <div class="empty">Загрузка…</div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>Сгенерировано AI Office</p>
    </div>
  </footer>

  <script>
    fetch('index.json')
      .then(r => r.json())
      .then(reports => {
        const el = document.getElementById('reports');
        if (!reports.length) {
          el.innerHTML = '<div class="empty">Нет отчётов. Запустите «Издатель» в AI Office.</div>';
          return;
        }
        el.innerHTML = reports.map(r => {
          const count = r.trends_count || r.articles_count || 0;
          const meta = r.categories ? `${count} новостей · ${r.categories}` : `${count} трендов`;
          return `<a href="${r.file}" class="report-card">
            <h3>${r.title}</h3>
            <p>${meta}</p>
          </a>`;
        }).join('');
      })
      .catch(() => {
        document.getElementById('reports').innerHTML = '<div class="empty">Ошибка загрузки.</div>';
      });
  </script>
</body>
</html>
